[project]
name = "employee-verification-v5"
version = "5.0.0"
description = "Employee Verification agent — A2A/A2UI agent on Vertex AI Agent Engine (BYOC), using Gemini Enterprise's built-in OAuth token propagation (Agent Engine V2 ingress, no STS/WIF)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=0.3.4,<1.0.0",
    "google-cloud-aiplatform[agent_engines,adk]>=1.144.0",
    "google-adk>=2.5.0",
    "a2ui-agent-sdk>=0.1.2",
    "google-cloud-bigquery>=3.20.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "starlette",
    "sse-starlette",
]

[tool.uv]
native-tls = true
