[project]
name = "emp-verify-google-oauth-v3"
version = "1.0.0"
description = "Employee Verification agent (emp_verify_google_oauth_v3) — A2UI/A2A agent on Vertex AI Agent Engine, using direct Google OAuth On-Behalf-Of (no Entra/STS/WIF) for BigQuery access."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.4,<1.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.128.0",
    "a2ui-agent-sdk>=0.1.2",
    "google-cloud-bigquery>=3.20.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
deploy = "scripts.deploy:main"


[tool.uv]
native-tls = true

