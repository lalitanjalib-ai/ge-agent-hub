[project]
name = "kpmg-agents"
version = "0.1.0"
description = "KPMG multi-agent platform using A2UI, A2A, and ADK on Agent Engine. Config-driven architecture for deploying multiple agents to Gemini Enterprise."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=0.3.4,<1.0.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.128.0",
    "a2ui-agent-sdk>=0.1.2",
    "google-cloud-bigquery>=3.20.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.scripts]
deploy = "scripts.deploy:main"
undeploy = "scripts.undeploy:main"

[tool.uv]
native-tls = true

# KPMG Artifact Foundry (optional — requires registry access).
# Uncomment if you have access and prefer the internal mirror:
