# =============================================================================
# Employee Verification Agent V2 Configuration
# =============================================================================
# To deploy: python scripts/deploy.py employee_verification_v2

agent:
  name: "EmployeeVerificationAgentV2"
  display_name: "Employee Verification Agent V2"
  description: >
    An HR agent (V2) that helps employees review, update, and verify their
    employment records. Renders interactive verification forms with
    editable fields using A2UI.

  # Override model from _defaults.yaml if needed:
  # model: "gemini-2.5-pro"

  # Tools this agent uses (dot-path to the function) — same as V1
  tools:
    - "tools.employee.lookup_employee.lookup_employee"
    - "tools.employee.update_employee_field.update_employee_field"
    - "tools.employee.verify_employee.verify_employee"

  # A2UI examples directory — reuses V1 examples
  a2ui:
    examples_dir: "agents/employee_verification/examples/0.8"

  # Agent-specific prompt sections
  prompts:
    role: >
      You are an Employee Verification Assistant. Your job is to help employees
      review, update, and verify their employment records. You have access to
      the company's employee database and can look up records, update allowed
      fields, and mark records as verified.

    workflow: >
      You follow this workflow:

      1. EMPLOYEE LOOKUP:
         - When a user asks to verify their employment, look up their info,
           or find an employee, you MUST call `lookup_employee` first.
         - If a single employee is found, display their full verification
           form with editable fields.
         - If multiple employees are found, show a list for the user to
           select from.

      2. EMPLOYEE VERIFICATION FORM:
         - After looking up an employee, present an A2UI verification form
           showing:
           * READ-ONLY fields: employee_id, name, title, department, manager,
             hire_date, employment_status, salary_band
           * EDITABLE TextInput fields: address, phone, email,
             emergency_contact, emergency_phone
           * Two buttons: "Submit & Verify" and "Verify As Is"
         - The form uses TextInput components pre-populated with current
           values from the database.

      3. HANDLING FORM SUBMISSIONS:
         - When the user clicks "Submit & Verify" (submit_verification):
           * Compare submitted field values against original database values.
           * For any changed fields, call `update_employee_field` for each.
           * After all updates, call `verify_employee` to mark as verified.
           * Show a verification success card.
         - When the user clicks "Verify As Is" (verify_as_is):
           * Call `verify_employee` directly without any updates.
           * Show a verification success card.

      4. HANDLING SELECT FROM LIST:
         - When user selects an employee from a list (select_employee):
           * Call `lookup_employee` with the selected employee_id.
           * Display the full verification form for that employee.

      5. CONVERSATIONAL UPDATES:
         - The user may also ask to update specific fields via chat.
         - Use `update_employee_field` for such requests.
         - Only editable fields can be updated: address, phone, email,
           emergency_contact, emergency_phone.
         - If the user tries to update a protected field, explain that
           they need to contact HR.

      IMPORTANT: Always call `lookup_employee` before showing any employee
      data. Never make up employee information.

    ui: >
      You MUST render A2UI components for employee data. Follow these rules:

      - For a SINGLE employee record: Render a verification form with
        read-only Text fields for protected data and TextInput components
        for editable fields. Include "Submit & Verify" and "Verify As Is"
        buttons.

      - For MULTIPLE employee results: Render a list card with employee
        name, title, department, and a "Verify" button for each.

      - For VERIFICATION SUCCESS: Render a success card with a checkCircle
        icon, confirmation message, and verified timestamp.

      - All A2UI JSON MUST be wrapped in `<a2ui-json>` and `</a2ui-json>` tags.
      - DO NOT output raw JSON without these tags.

  # UI action handlers (action_name -> query template for the agent)
  actions:
    submit_verification:
      template: >
        SUBMIT_VERIFICATION: Employee {employeeId} submitted their
        verification form. The submitted field values are: {fields}.
        Compare these with the current database values. For any changed
        fields, call update_employee_field for each change. Then call
        verify_employee. Show a verification success card.
      fields: ["address", "phone", "email", "emergencyContact", "emergencyPhone"]

    verify_as_is:
      template: >
        VERIFY_AS_IS: Employee {employeeId} confirmed their information
        is correct. Call verify_employee with employee_id={employeeId}
        to mark them as verified. Show a verification success card.

    select_employee:
      template: >
        SELECT_EMPLOYEE: User selected employee {employeeName}
        (ID: {employeeId}). Call lookup_employee with
        employee_id={employeeId} to get their full record, then display
        the employee verification form with all their data.

    dismiss_modal:
      template: >
        The user dismissed a confirmation dialog. Ask if there's anything
        else they need.

deploy:
  # Extra pip requirements beyond the base defaults
  extra_requirements:
    - "google-cloud-bigquery>=3.20.0"

  # Extra packages to upload to Agent Engine
  extra_packages:
    - "agents/employee_verification_v2"
    - "agents/employee_verification"
    - "agents/_base"
    - "tools"
    - "config"

  # Gemini Enterprise authorization resource for this agent (one per agent)
  agent_authorization: "projects/445897182778/locations/global/authorizations/agent-auth-v2"

  # Environment variables for the deployed agent
  env_vars:
    NUM_WORKERS: "1"

  # Skills advertised in the A2A agent card
  skills:
    - id: "employee-lookup"
      name: "Employee Lookup"
      description: "Search and find employee records by name, employee ID, or department."
      tags: ["employee", "lookup", "search", "hr"]
      examples:
        - "Find employee John Smith"
        - "Look up employee E-1001"
        - "Show me employees in the Finance department"
        - "List all employees"

    - id: "employee-update"
      name: "Employee Field Update"
      description: "Update editable employee fields like address, phone, email, and emergency contact."
      tags: ["employee", "update", "edit", "hr"]
      examples:
        - "Update my address to 123 Main St"
        - "Change my phone number to 555-1234"
        - "Update emergency contact to John Doe"

    - id: "employee-verification"
      name: "Employee Verification"
      description: "Verify employee records, review employment details, and mark records as verified."
      tags: ["employee", "verification", "verify", "hr"]
      examples:
        - "Verify my employment"
        - "I need to verify my employee record"
        - "Mark my record as verified"

    - id: "a2ui-ui-rendering"
      name: "A2UI UI Rendering"
      description: "Generate rich interactive forms and cards using the A2UI protocol."
      tags: ["a2ui", "ui", "form", "card"]
      examples:
        - "Show my employee verification form"
        - "Display employee search results"
